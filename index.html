    <!-- Fast zero-flicker theme hydration via IndexedDB (Version-less adaptive open) -->
    <script>
      (function() {
        try {
          var req = indexedDB.open('zelvior_devkit_db');
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (db.objectStoreNames.contains('settings')) {
              var tx = db.transaction('settings', 'readonly');
              var getReq = tx.objectStore('settings').get('themeMode');
              getReq.onsuccess = function() {
                var mode = getReq.result;
                if (mode === 'light') {
                  document.documentElement.classList.remove('dark');
                } else if (mode === 'dark') {
                  document.documentElement.classList.add('dark');
                } else {
                  if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.remove('dark');
                  } else {
                    document.documentElement.classList.add('dark');
                  }
                }
              };
            }
          };
          req.onerror = function() {
            if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.remove('dark');
            }
          };
        } catch (err) {
          // Fallback to dark
        }
      })();
    </script>
